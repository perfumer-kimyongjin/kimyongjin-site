<header>

  <nav>
    <a href="works-2025.html">WORKS</a>

    <a href="magazine-2023.html">MAGAZINE</a>

  </nav>

<main>
  <section class="contact">
    <div class="contact-inner">
      <div class="col">
        <b>CONTACT</b><br>
        <br>
        향 작업, 강연, 협업 문의를 남겨주시면<br>
        확인 후 회신드리겠습니다.<br>
        <br>
        Please leave an inquiry about fragrance work,<br>
        lectures or collaboration.<br>
        <br>
        <a href="mailto:contact@kimyongjin.kr">contact@kimyongjin.kr</a><br>
        <br>
        <a href="https://www.youtube.com/user/kyj8757" target="_blank" rel="noopener">YouTube</a>
      </div>

      <div class="col">
        <!-- FORMSPREE_ENDPOINT 를 발급받은 주소로 바꿔주세요 -->
        <form class="contact-form" action="FORMSPREE_ENDPOINT" method="POST">
          <label for="cf-name">이름 / Name</label>
          <input id="cf-name" type="text" name="name" required>

          <label for="cf-email">이메일 / Email</label>
          <input id="cf-email" type="email" name="email" required>

          <label for="cf-message">내용 / Message</label>
          <textarea id="cf-message" name="message" rows="7" required></textarea>

          <input type="hidden" name="_subject" value="kimyongjin.kr 문의">
          <button type="submit">보내기 / Send</button>
        </form>
        <p class="form-note" hidden>보내주셔서 감사합니다. 확인 후 회신드리겠습니다.</p>
      </div>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
